<!-- الغلاف الخارجي: flex + justify-center يوسّط الكرت، و py-12 مسافة من فوق وتحت -->
<div class="flex justify-center py-12 px-4" dir="rtl">
  <!-- الكرت: max-w-md يحدد العرض، bg-white خلفية بيضاء، rounded-2xl زوايا، shadow ظل -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <!-- العنوان والسطر اللي تحته -->
    <h2 class="text-2xl font-bold text-center mb-1">تعديل بيانات اللاعب</h2>
    <p class="text-sm text-gray-500 text-center mb-6">عدّل البيانات اللي بدك إياها واضغط حفظ</p>

    @if (isLoading()) {
      <p class="text-center text-gray-600">جاري التحميل...</p>
    } @else {
      <!-- flex-col يحط الحقول تحت بعض، و gap-4 مسافة ثابتة بينهم -->
      <div class="flex flex-col gap-4">
        <!-- block w-full: نخلي كل حقل ياخذ عرض الكرت كامل -->
        <app-custom-input
          class="block w-full"
          label="الاسم الأول"
          [(value)]="firstName"
          [required]="true"
        ></app-custom-input>
        <app-custom-input
          class="block w-full"
          label="الاسم الأخير"
          [(value)]="lastName"
          [required]="true"
        ></app-custom-input>
        <app-custom-input
          class="block w-full"
          label="رقم الهاتف"
          type="tel"
          [(value)]="phone"
        ></app-custom-input>
        <app-custom-input
          class="block w-full"
          label="البريد الإلكتروني"
          type="email"
          [(value)]="email"
        ></app-custom-input>
      </div>

      <!-- زر بعرض الكرت كامل، ويغمق لونه لما يمر عليه الماوس -->
      <button
        class="w-full mt-6 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold cursor-pointer"
        (click)="onUpdate()"
      >
        حفظ اللاعب
      </button>
    }

    <!-- رسالة النتيجة -->
    @if (message()) {
      <p class="mt-4 text-center text-gray-700">{{ message() }}</p>
    }
  </div>
</div>
