<div class="mx-auto w-full max-w-xl px-4 py-8 sm:py-12">
  <!-- العنوان -->
  <div class="mb-6">
    <h2 class="text-2xl font-bold tracking-tight text-slate-800">
      {{ 'branch.title' | translate }}
    </h2>
    <div class="mt-2 h-1 w-12 rounded-full bg-indigo-500"></div>
  </div>

  <form
    class="space-y-5 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8"
    (submit)="$event.preventDefault(); submit()"
  >
    <!-- اسم الفرع -->
    <div>
      <label for="branchName" class="mb-1.5 block text-sm font-medium text-slate-700">
        {{ 'branch.name' | translate }}
      </label>
      <div class="relative">
        <span
          class="pointer-events-none absolute inset-y-0 start-0 flex items-center ps-3.5 text-slate-400"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.993 2.993 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 002.25 1.016c.896 0 1.7-.393 2.25-1.015a3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72L4.318 3.44A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72"
            />
          </svg>
        </span>
        <input
          id="branchName"
          type="text"
          class="block w-full rounded-xl border border-slate-300 bg-slate-50 py-2.5 ps-11 pe-4 text-start text-slate-800 placeholder:text-slate-400 transition focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-indigo-100"
          [value]="branchName()"
          (input)="branchName.set($any($event.target).value)"
          [placeholder]="'branch.namePlaceholder' | translate"
        />
      </div>
    </div>

    <!-- عنوان الفرع -->
    <div>
      <label for="branchAddres" class="mb-1.5 block text-sm font-medium text-slate-700">
        {{ 'branch.address' | translate }}
      </label>
      <div class="relative">
        <span
          class="pointer-events-none absolute inset-y-0 start-0 flex items-center ps-3.5 text-slate-400"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"
            />
          </svg>
        </span>
        <input
          id="branchAddres"
          type="text"
          class="block w-full rounded-xl border border-slate-300 bg-slate-50 py-2.5 ps-11 pe-4 text-start text-slate-800 placeholder:text-slate-400 transition focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-indigo-100"
          [value]="branchAddres()"
          (input)="branchAddres.set($any($event.target).value)"
          [placeholder]="'branch.addressPlaceholder' | translate"
        />
      </div>
    </div>

    <!-- مدير الفرع -->
    <div>
      <label for="branchManger" class="mb-1.5 block text-sm font-medium text-slate-700">
        {{ 'branch.manager' | translate }}
      </label>
      <div class="relative">
        <span
          class="pointer-events-none absolute inset-y-0 start-0 flex items-center ps-3.5 text-slate-400"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
            />
          </svg>
        </span>
        <input
          id="branchManger"
          type="text"
          class="block w-full rounded-xl border border-slate-300 bg-slate-50 py-2.5 ps-11 pe-4 text-start text-slate-800 placeholder:text-slate-400 transition focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-indigo-100"
          [value]="branchManger()"
          (input)="branchManger.set($any($event.target).value)"
          [placeholder]="'branch.managerPlaceholder' | translate"
        />
      </div>
    </div>

    <!-- الرسائل -->
    @if (error()) {
      <div
        role="alert"
        class="flex items-start gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
      >
        <svg
          class="mt-0.5 h-5 w-5 shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"
          />
        </svg>
        <span>{{ error() | translate }}</span>
      </div>
    }
    @if (success()) {
      <div
        role="status"
        class="flex items-start gap-2 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700"
      >
        <svg
          class="mt-0.5 h-5 w-5 shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        <span>{{ 'branch.addSuccess' | translate }}</span>
      </div>
    }

    <!-- الزر -->
    <button
      type="submit"
      [disabled]="loading()"
      class="flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-200 active:scale-[.99] disabled:cursor-not-allowed disabled:opacity-60"
    >
      @if (loading()) {
        <svg class="h-5 w-5 animate-spin" viewBox="0 0 24 24" fill="none">
          <circle
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
            class="opacity-25"
          />
          <path fill="currentColor" class="opacity-75" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
        </svg>
      }
      {{ (loading() ? 'branch.saving' : 'branch.save') | translate }}
    </button>
  </form>
</div>
