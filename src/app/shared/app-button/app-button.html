<!-- app-button.html -->
<button
  [type]="type"
  [disabled]="disabled || loading"
  (click)="onClick()"
  class="rounded-md py-2 px-4 font-medium transition disabled:opacity-50 flex items-center justify-center gap-2"
  [class.bg-blue-600]="variant === 'primary'"
  [class.text-white]="variant === 'primary'"
  [class.bg-red-600]="variant === 'danger'"
  [class.bg-slate-200]="variant === 'secondary'"
>
  @if (loading) {
    <span class="animate-spin">⏳</span>
  }
  {{ loading ? 'جاري الحفظ...' : label }}
</button>
